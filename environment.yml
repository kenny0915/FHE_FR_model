name: face_recog
channels:
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # Keep NumPy below 1.24: MXNet 1.9 still uses removed NumPy aliases.
      - numpy==1.23.5
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.1.2+cu118
      - torchvision==0.16.2+cu118
      - torchaudio==2.1.2+cu118
      - mxnet==1.9.1
      - opencv-python-headless==4.9.0.80
      - scipy==1.15.3
      - scikit-learn==1.7.2
      - scikit-image==0.21.0
      - tensorboard==2.20.0
      - easydict==1.13
      - matplotlib==3.10.9
      - pandas==2.3.3
      - pillow==12.2.0
      - onnx==1.21.0
      - graphviz==0.8.4
      - imageio==2.37.3
